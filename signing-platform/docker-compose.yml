services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signer}
      POSTGRES_USER: ${POSTGRES_USER:-signer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me}
    volumes:
      - minio_data:/data
    ports: ["9000:9000", "9001:9001"]

  api:
    build: ./api
    env_file: .env
    depends_on: [postgres, redis, minio, signature-engine]
    ports: ["8000:8000"]

  signature-engine:
    build: ./signature-engine
    ports: ["8080:8080"]

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  postgres_data:
  minio_data:
